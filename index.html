<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スライドパズル (PWA)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#222222">
  
  <style>
    body {
      background: #222;
      color: #fff;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      /* スマホでのスクロールやハイライトを防止 */
      touch-action: none; 
      user-select: none;
    }

    /* パズルの外枠 */
    #board {
      position: relative;
      width: 320px;
      height: 320px;
      background: #444;
      border: 6px solid #888;
      border-radius: 8px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    /* 動くブロックのスタイル */
    .tile {
      position: absolute;
      width: 80px;
      height: 80px;
      background: #00ffff;
      color: #000;
      font-size: 32px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      border: 2px solid #00aaaa;
      border-radius: 8px;
      cursor: pointer;
      /* ここが滑らかなアニメーションの肝！ */
      transition: transform 0.15s ease-in-out;
    }

    #message {
      margin-top: 24px;
      font-size: 24px;
      font-weight: bold;
      color: #ff0;
      height: 30px; /* 文字がない時も高さを確保 */
    }
  </style>
</head>
<body>
  
  <div id="board"></div>
  <div id="message"></div>

  <script src="main.js"></script>
</body>
</html>
